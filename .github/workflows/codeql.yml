name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because advisories land after code does: a rule added upstream
    # can find something in code that has not changed since it was written.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to file findings
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Nothing here pushes, so the token does not need to survive
          # checkout — left in .git/config it can ride along in an artifact.
          persist-credentials: false

      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: python
          # security-extended over the default: this repository's subject is
          # untrusted input crossing a process boundary, which is where the
          # extra rules concentrate.
          queries: security-extended

      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
