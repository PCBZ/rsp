name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
# nltk, which the sentence splitter pulls in, refuses the hardlinks uv makes by default.
env:
  UV_LINK_MODE: copy

# Actions are pinned to commit SHAs: whoever can move a tag can run code with this job's token.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Nothing pushes, so the token is not left behind in .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.0.1
        with:
          enable-cache: true
      # --frozen fails when uv.lock is out of date with pyproject.toml.
      - run: uv sync --frozen
      - run: uv run ruff check rsp/ tests/ plugins/ conformance/
      - run: uv run ruff format --check rsp/ tests/ plugins/ conformance/

      # actionlint for expression and matrix mistakes, zizmor for workflow security.
      - run: uvx --from actionlint-py==1.7.12.24 actionlint .github/workflows/*.yml
      - run: uvx zizmor==1.9.0 --persona=regular .github/workflows/

  test:
    strategy:
      fail-fast: false
      matrix:
        # From the floor in pyproject.toml to whatever is current.
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        # One macOS job: process groups and pipe buffers (16 KiB, not 64) differ from Linux.
        include:
          - python: "3.12"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      # Unit tests, conformance cases and drift checks are all pytest.
      - run: uv run pytest tests/ -q --cov --cov-report=xml

      # One upload: coverage does not differ across the matrix.
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
