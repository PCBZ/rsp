name: Plugins

# Separate from CI because a failure here can mean upstream changed rather than
# we did. Hence the schedule: gitleaks retiring a rule changes a verdict for
# content that has not changed, and no pull request would reveal it.

on:
  push:
    branches: [main]
    paths: &paths
      - "examples/**"
      - "conformance/**"
      - "tests/**"
      # The suite here runs the host too, so a runtime or dependency change
      # reaches it — and this is the only job with the tools to notice.
      - "rsp/**"
      - "pyproject.toml"
      - "SPEC.md"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths: *paths
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

env:
  # One pin for both downloads: the binary, and the test files it is developed
  # against, which ship in the source archive and not in the release.
  GITLEAKS_VERSION: 8.30.1
  # uv hardlinks from its cache, and nltk — which the sentence splitter pulls
  # in — refuses to open a file with more than one link (CWE-59).
  UV_LINK_MODE: copy

jobs:
  gitleaks:
    # One job for every adapter over this binary, because the cases are shared
    # and a plugin that disagrees with its siblings is the finding. The binary
    # is a different build on each runner, and the pipe between the plugin and
    # it belongs to the operating system.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux_x64
          - runner: macos-latest
            platform: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.0.1
        with:
          enable-cache: true
      # The image supplied Node 22, where the test runner rejected a directory.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/gitleaks-ts/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          # Nothing to cache: the standard library is the whole dependency
          # list, so there is no go.sum for setup-go to key on.
          cache: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_${{ matrix.platform }}.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "${base}/${asset}"
          curl -sSfLO "${base}/${sums}"
          grep " ${asset}\$" "${sums}" | shasum -a 256 --check --strict -
          tar -xzf "${asset}" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Unit tests and types
        working-directory: examples/gitleaks-ts
        run: |
          npm ci
          npm run typecheck
          npm test

      # Built once rather than `go run` per call: the corpus suite invokes the
      # plugin four hundred times.
      - name: Build and test the Go plugin
        working-directory: examples/gitleaks-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build -o "${RUNNER_TEMP}/rsp-gitleaks-go" .

      # Built once for the same reason, and released: a debug build of the
      # Rust plugin spends longer starting than scanning.
      - name: Build and test the Rust plugin
        working-directory: examples/gitleaks-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
          cp target/release/rsp-gitleaks-rs "${RUNNER_TEMP}/rsp-gitleaks-rs"

      # Other people's test secrets, kept out of the checkout.
      - name: Fetch the corpus
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/corpus"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/archive/refs/tags/v${GITLEAKS_VERSION}.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/corpus" --strip-components=2 \
              "gitleaks-${GITLEAKS_VERSION}/testdata"
          find "${RUNNER_TEMP}/corpus" -type f | wc -l

      # Nothing skips for a missing tool here, so this is the only run that
      # covers every clause against every implementation — the report's point.
      - name: Every case, every tool present
        run: uv run --frozen pytest tests/ -q --html=report.html --self-contained-html
        env:
          RSP_REQUIRE_ALL_PLUGINS: "1"
          RSP_GITLEAKS_CORPUS: ${{ runner.temp }}/corpus
          RSP_PLUGIN_GITLEAKS_GO: ${{ runner.temp }}/rsp-gitleaks-go
          RSP_PLUGIN_GITLEAKS_RS: ${{ runner.temp }}/rsp-gitleaks-rs

      # always(): the report of a run that failed is the one worth reading.
      # One platform, like the coverage upload — a clause matrix is not
      # platform-specific.
      - if: always() && matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: report.html
