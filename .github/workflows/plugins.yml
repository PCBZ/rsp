name: Plugins

# Separate from CI, and scheduled, because a failure here can mean upstream changed:
# gitleaks retiring a rule changes a verdict without any pull request.

on:
  push:
    branches: [main]
    paths: &paths
      - "examples/**"
      - "conformance/**"
      - "tests/**"
      # The suite runs the host too.
      - "rsp/**"
      - "pyproject.toml"
      - "SPEC.md"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths: *paths
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

env:
  # One pin for the binary and for the test corpus in its source archive.
  GITLEAKS_VERSION: 8.30.1
  UV_LINK_MODE: copy  # see ci.yml

jobs:
  gitleaks:
    # One job for every adapter over this binary: the cases are shared, and
    # disagreement is the finding. Two OSes, because the binary and the pipe differ.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux_x64
          - runner: macos-latest
            platform: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.0.1
        with:
          enable-cache: true
      # The image supplied Node 22, where the test runner rejected a directory.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/gitleaks-ts/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache: false  # stdlib only, so there is no go.sum to key on

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_${{ matrix.platform }}.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "${base}/${asset}"
          curl -sSfLO "${base}/${sums}"
          grep " ${asset}\$" "${sums}" | shasum -a 256 --check --strict -
          tar -xzf "${asset}" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Unit tests and types
        working-directory: examples/gitleaks-ts
        run: |
          npm ci
          npm run typecheck
          npm test

      # Built once, not `go run` per call: the corpus suite calls it four hundred times.
      - name: Build and test the Go plugin
        working-directory: examples/gitleaks-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          # -count=1: the offset table lives outside this module, so the cache misses changes.
          go test -count=1 ./...
          go build -o "${RUNNER_TEMP}/rsp-gitleaks-go" .

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      # gson is pinned and checksummed by the Makefile, the way this job pins
      # gitleaks: Java has no JSON in its standard library either.
      - name: Build and test the Java plugin
        working-directory: examples/gitleaks-java
        run: make test

      # macOS has Swift already; the Linux runner does not, and this is the
      # largest toolchain this job installs.
      - uses: swift-actions/setup-swift@682457186b71c25a884c45c06f859febbe259240 # v2.3.0
        if: runner.os == 'Linux'
        with:
          swift-version: '6.0'

      - name: Build and test the Swift plugin
        working-directory: examples/gitleaks-swift
        run: make test

      - name: Install cJSON
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libcjson-dev
          else
            brew install cjson
          fi

      # Twice: once as it ships, once under the sanitizers. Refusing a Match
      # shorter than its span is memory safety, not behaviour, so no assertion
      # here can see it go — ASan can.
      - name: Build and test the C plugin
        working-directory: examples/gitleaks-c
        run: |
          make test
          make clean
          make CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined $EXTRA_I" \
               LDFLAGS="-fsanitize=address,undefined $EXTRA_L" test
          make clean
          make rsp-gitleaks-c
        env:
          EXTRA_I: ${{ runner.os == 'macOS' && '-I/opt/homebrew/include' || '' }}
          EXTRA_L: ${{ runner.os == 'macOS' && '-L/opt/homebrew/lib' || '' }}

      # Release build: a debug build spends longer starting than scanning.
      - name: Build and test the Rust plugin
        working-directory: examples/gitleaks-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
          cp target/release/rsp-gitleaks-rs "${RUNNER_TEMP}/rsp-gitleaks-rs"

      # Other people's test secrets, kept out of the checkout.
      - name: Fetch the corpus
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/corpus"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/archive/refs/tags/v${GITLEAKS_VERSION}.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/corpus" --strip-components=2 \
              "gitleaks-${GITLEAKS_VERSION}/testdata"
          find "${RUNNER_TEMP}/corpus" -type f | wc -l

      # The Python adapter needs no build step, but `pytest tests/` does not
      # reach examples/, so it is named rather than assumed.
      # Nothing skips here, so this is the only run of every clause against every plugin.
      - name: Every case, every tool present
        run: uv run --frozen pytest tests/ examples/gitleaks-py/ -q --html=report.html --self-contained-html
        env:
          RSP_REQUIRE_ALL_PLUGINS: "1"
          RSP_GITLEAKS_CORPUS: ${{ runner.temp }}/corpus
          RSP_PLUGIN_GITLEAKS_GO: ${{ runner.temp }}/rsp-gitleaks-go
          RSP_PLUGIN_GITLEAKS_RS: ${{ runner.temp }}/rsp-gitleaks-rs
          RSP_PLUGIN_GITLEAKS_C: ${{ github.workspace }}/examples/gitleaks-c/rsp-gitleaks-c
          RSP_PLUGIN_GITLEAKS_JAVA: ${{ github.workspace }}/examples/gitleaks-java/rsp-gitleaks-java
          RSP_PLUGIN_GITLEAKS_SWIFT: ${{ github.workspace }}/examples/gitleaks-swift/.build/release/rsp-gitleaks-swift

      # always(): a failed run's report is the one worth reading. One OS is enough.
      - if: always() && matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: report.html
