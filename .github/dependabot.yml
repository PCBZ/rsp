version: 2

updates:
  # The reason this file exists. Actions are pinned to commit SHAs, which does
  # not rot loudly: a frozen pin looks identical to a current one. Dependabot
  # rewrites the SHA and the version comment together, which is what keeps SHA
  # pinning sustainable rather than something we quietly abandon.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # The protocol core declares no dependencies, so this covers dev tooling and
  # the optional llamaindex extra. One grouped PR a month rather than five.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev:
        patterns: ["*"]
