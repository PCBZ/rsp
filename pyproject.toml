[project]
name = "rsp"
version = "0.1.0.dev0"
description = "RAG Security Protocol — where security tools hook into a RAG pipeline, and what they return"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# The protocol core has no runtime dependencies: subprocess plus JSON from the
# stdlib. Anything that pulls in a third party belongs in an optional extra, so
# that a plugin author installing rsp does not inherit a RAG framework.
dependencies = []

[project.optional-dependencies]
# Reference host adapter (rsp/guards.py). Optional on purpose — see D7.
llamaindex = ["llama-index-core>=0.14,<0.15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "rsp[llamaindex]",
    "pytest-html>=4.1,<5",
    "jsonschema>=4",
]

[project.scripts]
rsp = "rsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsp"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["rsp"]
branch = true

[tool.coverage.report]
# Plugins are subprocesses and never imported, so coverage cannot see them,
# and conformance/ is data.
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ =="]
