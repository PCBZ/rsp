[project]
name = "rag-security-protocol"
version = "0.1.1rc1"
description = "RAG Security Protocol — where security tools hook into a RAG pipeline, and what they return"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# The distribution spells the protocol out; the package stays `import rsp`.
authors = [{ name = "PCBZ" }]
keywords = ["rag", "security", "protocol", "llm", "redaction", "conformance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# No runtime dependencies: a plugin author installing rsp should not inherit a RAG framework.
dependencies = []

[project.optional-dependencies]
# Reference host adapter (rsp/guards.py). Optional on purpose — see D7.
llamaindex = ["llama-index-core>=0.14,<0.15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    # By the name this project declares: `rsp` on PyPI is someone else's package,
    # and naming it here installs that one over this tree.
    "rag-security-protocol[llamaindex]",
    "pytest-html>=4.1,<5",
    "jsonschema>=4",
]

[project.scripts]
rsp = "rsp.cli:main"

[project.urls]
Homepage = "https://github.com/PCBZ/rsp"
Specification = "https://github.com/PCBZ/rsp/blob/main/SPEC.md"
Issues = "https://github.com/PCBZ/rsp/issues"
Changelog = "https://github.com/PCBZ/rsp/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsp"]
# Typing :: Typed is a claim; py.typed is what makes it true for a consumer.
artifacts = ["rsp/py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# What ruff can check of AGENTS.md's Style section. No D1: it asks for more docstrings.
extend-select = [
    "ANN0", "ANN2", "B", "C4", "D2", "D3", "I", "N", "PIE", "PLW0108", "RET", "RUF", "SIM", "UP",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"!rsp/**" = ["ANN"]

[tool.coverage.run]
source = ["rsp"]  # plugins run as subprocesses, and conformance/ is data
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ =="]
