[project]
name = "rsp"
version = "0.1.0.dev0"
description = "RAG Security Protocol — where security tools hook into a RAG pipeline, and what they return"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# No runtime dependencies: a plugin author installing rsp should not inherit a RAG framework.
dependencies = []

[project.optional-dependencies]
# Reference host adapter (rsp/guards.py). Optional on purpose — see D7.
llamaindex = ["llama-index-core>=0.14,<0.15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "rsp[llamaindex]",
    "pytest-html>=4.1,<5",
    "jsonschema>=4",
]

[project.scripts]
rsp = "rsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# What ruff can check of AGENTS.md's Style section. No D1: it asks for more docstrings.
extend-select = [
    "ANN0", "ANN2", "B", "C4", "D2", "D3", "I", "N", "PIE", "PLW0108", "RET", "RUF", "SIM", "UP",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"!rsp/**" = ["ANN"]

[tool.coverage.run]
source = ["rsp"]  # plugins run as subprocesses, and conformance/ is data
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ =="]
